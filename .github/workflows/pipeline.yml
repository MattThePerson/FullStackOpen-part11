
name: Deployment Pipeline

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
    types: [opened, synchronize]

jobs:
  # job: Lint and Tests
  lint_and_tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: '24'
      - run: npm install
      - run: npm run eslint
      - run: npm test
      - run: npm run build
  # job: playwright_tests
  # playwright_tests:
  #   timeout-minutes: 60
  #   runs-on: ubuntu-latest
  #   steps:
  #     - uses: actions/checkout@v6
  #     - uses: actions/setup-node@v6
  #       with:
  #         node-version: 24
  #     - run: npm install
  #     - name: Install Playwright browsers
  #       run: npx playwright install --with-deps
  #     - name: Run Playwright tests
  #       run: npm run test:e2e
  #     - uses: actions/upload-artifact@v4
  #       if: ${{ !cancelled() }}
  #       with:
  #         name: playwright-report
  #         path: playwright-report/
  #         retention-days: 30
  # job: bump version (patch)
  tag_release:
    # needs: [lint_and_tests, playwright_tests]
    needs: [lint_and_tests]
    if: ${{ github.event_name == 'push' }}
    permissions:
      contents: write
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: '0'
      - name: Bump version and push tag
        uses: anothrNick/github-tag-action@1.75.0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          DEFAULT_BUMP: patch
  # job: Deploy to Render
  deploy_to_render:
    needs: [tag_release]
    if: ${{ github.event_name == 'push' }}
    runs-on: ubuntu-latest
    steps:
      - name: Call Deploy Hook
        run: |
          curl "${{ secrets.RENDER_DEPLOY_HOOK }}"
  # job: show github environment
  # test_show_env:
  #   runs-on: ubuntu-latest
  #   steps:
  #     - uses: actions/checkout@v4
  #     - name: github context
  #       env:
  #         GITHUB_CONTEXT: ${{ toJson(github) }}
  #       run: echo "$GITHUB_CONTEXT"
  #     - name: commits
  #       env:
  #         COMMITS: ${{ toJson(github.event.commits) }}
  #       run: echo "$COMMITS"
  #     - name: commit messages
  #       env:
  #         COMMIT_MESSAGES: ${{ toJson(github.event.commits.*.message) }}
  #       run: echo "$COMMIT_MESSAGES"
  # job: 
  test_if_commit_contains:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: (1) print commit
        env:
          COMMIT_MESSAGE: ${{ join(toJson(github.event.commits.*.message), '  |  ') }}
        run: echo ${{ $COMMIT_MESSAGE }}
      - name: (2) print not contains skip
        env:
          COMMIT_MESSAGE: ${{ join(toJson(github.event.commits.*.message), '  |  ') }}
        run: echo ${{ !contains($COMMIT_MESSAGE, '#skip') }}
      - name: (3) print not containts DONKEY
        env:
          COMMIT_MESSAGE: ${{ join(toJson(github.event.commits.*.message), '  |  ') }}
        run: echo ${{ !contains($COMMIT_MESSAGE, 'DONKEY') }}
      - name: (4) if not contians DONKEY
        env:
          COMMIT_MESSAGE: ${{ join(toJson(github.event.commits.*.message), '  |  ') }}
        if: ${{ !contains($COMMIT_MESSAGE, 'DONKEY') }}
        run: echo "No DONKEY"
      - name: (5) if not contians skip
        env:
          COMMIT_MESSAGE: ${{ join(toJson(github.event.commits.*.message), '  |  ') }}
        if: ${{ !contains($COMMIT_MESSAGE, '#skip') }}
        run: echo "No skip"


