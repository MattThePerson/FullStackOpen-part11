
name: Deployment Pipeline

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  # job: Lint and Tests
  lint_and_tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: '24'
      - run: npm install
      - run: npm run eslint
      - run: npm test
      - run: npm run build
  # job: playwright_tests
  playwright_tests:
    timeout-minutes: 60
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 24
      - run: npm install
      - name: Install Playwright browsers
        run: npx playwright install --with-deps
      - name: Run Playwright tests
        run: npm run test:e2e
      - uses: actions/upload-artifact@v4
        if: ${{ !cancelled() }}
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 30
  # job: bump version (patch)
  tag_release:
    needs:
      - lint_and_tests
      - playwright_tests
    if: ${{ github.event_name == 'push' && !contains(join(github.event.commits.*.message, ' | '), '#skip') }}
    permissions:
      contents: write
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: '0'
      - name: Bump version and push tag
        uses: anothrNick/github-tag-action@1.75.0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          DEFAULT_BUMP: patch
  # job: deploy to Render
  deploy:
    needs:
      - lint_and_tests
      - playwright_tests
      - tag_release
    if: ${{ github.event_name == 'push' }}
    runs-on: ubuntu-latest
    steps:
      - name: Call Deploy Hook
        if: ${{ !contains(join(github.event.commits.*.message, ' | '), '#nodeploy') }}
        run: |
          curl --fail -sS "${{ secrets.RENDER_DEPLOY_HOOK }}"
  # job: Discord notification (success)
  notify_discord_succ:
    needs:
      - lint_and_tests
      - playwright_tests
      - deploy
    if: ${{ github.event_name == 'push' }}
    runs-on: ubuntu-latest
    steps:
      - uses: sarisia/actions-status-discord@v1
        with:
          webhook: ${{ secrets.DISCORD_WEBHOOK }}
          status: ${{ job.status }}
          color: 0x00ff00
          content: "✅ Success <@219184876098813952>"
          title: "Deploy to Render"
          description: "Build and deploy to Render"
          username: GitHub Actions
          avatar_url: https://github.com/${{ github.actor }}.png
  # job: Discord notification (fail)
  notify_discord_fail:
    needs:
      - lint_and_tests
      - playwright_tests
      - deploy
    runs-on: ubuntu-latest
    if: failure()
    steps:
      - uses: sarisia/actions-status-discord@v1
        with:
          webhook: ${{ secrets.DISCORD_WEBHOOK }}
          status: ${{ job.status }}
          color: 0xff0000
          content: "❌ Jobs Failed <@219184876098813952>"
          title: "Deploy to Render"
          description: "Build and deploy to Render"
          username: GitHub Actions
          avatar_url: https://github.com/${{ github.actor }}.png

