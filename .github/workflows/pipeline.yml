
name: Deployment Pipeline

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
    # types: [opened, synchronize]

jobs:
  # job: Lint and Tests
  lint_and_tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: '24'
      - run: npm install
      - run: npm run eslint
      - run: npm test
      - run: npm run build
  # job: playwright_tests
  playwright_tests:
    timeout-minutes: 60
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 24
      - run: npm install
      - name: Install Playwright browsers
        run: npx playwright install --with-deps
      - name: Run Playwright tests
        run: npm run test:e2e
      - uses: actions/upload-artifact@v4
        if: ${{ !cancelled() }}
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 30
  # job: declare release
  declare_release:
    needs:
      - lint_and_tests
      # - playwright_tests
    if: ${{ github.event_name == 'push' }}
    runs-on: ubuntu-latest
    steps:
      - run: echo "Release!"
  # job: bump version (patch)
  tag_release:
    needs: [declare_release]
    if: ${{ !contains(join(github.event.commits.*.message, ' | '), '#skip') }}
    permissions:
      contents: write
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: '0'
      - name: Bump version and push tag
        uses: anothrNick/github-tag-action@1.75.0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          DEFAULT_BUMP: patch
  # job: Deploy to Render
  deploy_to_render:
    needs: [declare_release]
    if: ${{ !contains(join(github.event.commits.*.message, ' | '), '#nodeploy') }}
    runs-on: ubuntu-latest
    steps:
      - name: Call Deploy Hook
        run: |
          curl "${{ secrets.RENDER_DEPLOY_HOOK }}"
  # job: Discord notification
  notify_discord:
    needs: [declare_release]
    runs-on: ubuntu-latest
    steps:
      - name: Success notification
        if: ${{ success() }}
        uses: sarisia/actions-status-discord@v1
        with:
          webhook: ${{ secrets.DISCORD_WEBHOOK }}
          status: ${{ job.status }}
          content: "Hey <@rekt_solar_beam>"
          title: "deploy"
          description: "Build and deploy to Render"
          # image: ${{ secrets.EMBED_IMAGE }}
          color: 0x0000ff
          url: "https://github.com/sarisia/actions-status-discord"
          username: GitHub Actions
      - name: Failure notification
        if: ${{ failure() }}
        uses: sarisia/actions-status-discord@v1
        with:
          webhook: ${{ secrets.DISCORD_WEBHOOK }}
          status: ${{ job.status }}
          nodetail: true
          title: "Build and deploy `Failed!`"
          description: |
            Version `${{ github.event.release.tag_name }}`
          color: 0xff0000

      # - uses: sarisia/actions-status-discord@v1
