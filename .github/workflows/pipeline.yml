
name: Simple deployment pipeline

on:
  push:
    branches: [main]
    pull_request:
      branches: [main]
      types: [opened, synchronize]

jobs:
  simple_deploymnet_pipeline:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: '24'
      - run: npm install
      - run: npm run eslint
      - run: npm test
      - run: npm run build

