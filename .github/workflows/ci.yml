
name: Deploy to Render

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
    types: [opened, synchronize]

jobs:
  deploy_to_render:
    if: ${{ github.event_name == 'push' }}
    runs-on: ubuntu-latest
    steps:
      - name: Call Deploy Hook
        run: |
          curl "${{ secrets.RENDER_DEPLOY_HOOK }}"

